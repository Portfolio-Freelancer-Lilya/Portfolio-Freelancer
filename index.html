<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Անրի Սահակյանի 10-ամյակ | Ծննդյան Տոն</title>
    <meta name="description" content="Սիրով հրավիրում ենք Անրիի 10-ամյակի ծննդյան տոնակատարությանը">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Russo+One&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --grass-dark: #1a5f1a;
            --grass-light: #2d8a2d;
            --grass-bright: #4ade4a;
            --white: #ffffff;
            --black: #1a1a1a;
            --gold: #FFD700;
            --accent: #00ff88;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #0f2814 0%, #1a5f1a 100%);
            color: var(--white);
            line-height: 1.6;
            overflow-x: hidden; /* Կանխում է հորիզոնական շարժումը */
            position: relative;
            min-height: 100vh;
            width: 100%;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(74, 222, 74, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 255, 136, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .grass-stripes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                90deg,
                transparent,
                transparent 50px,
                rgba(255,255,255,0.03) 50px,
                rgba(255,255,255,0.03) 100px
            );
            pointer-events: none;
            z-index: 1;
        }

        /* Hero Section */
        .hero {
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem; /* Ազատ, լայն տեսք */
            position: relative;
            z-index: 2;
            background: linear-gradient(180deg, 
                rgba(26, 95, 26, 0.9) 0%, 
                rgba(15, 40, 20, 0.95) 100%);
        }

        .football-decoration {
            position: absolute;
            font-size: 15rem;
            opacity: 0.05;
            animation: rotate 20s linear infinite;
            z-index: 0;
            pointer-events: none;
        }

        .football-decoration.top-right {
            top: -50px;
            right: -50px;
        }

        .football-decoration.bottom-left {
            bottom: -50px;
            left: -50px;
            animation-direction: reverse;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, var(--gold), #FFA500);
            color: var(--black);
            padding: 0.6rem 1.5rem;
            border-radius: 50px;
            font-weight: 800;
            font-size: 1rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
            animation: fadeInDown 1s ease;
        }

        .hero-image {
            width: 280px;
            height: 280px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid var(--gold);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 25px rgba(255, 215, 0, 0.4);
            margin-bottom: 1.5rem;
            animation: fadeInUp 1s ease 0.2s backwards;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            animation: fadeInUp 1s ease;
            width: 100%;
            /* Հեռացված է խիստ max-width-ը, որպեսզի լինի ավելի լայն */
        }

        .hero-name {
            font-family: 'Russo One', sans-serif;
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 900;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--white) 0%, var(--grass-bright) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 4px 20px rgba(74, 222, 74, 0.3);
            letter-spacing: 2px;
            word-wrap: break-word;
        }

        .hero-age {
            font-family: 'Russo One', sans-serif;
            font-size: clamp(4rem, 15vw, 8rem);
            color: var(--gold);
            margin: 1rem 0;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.6);
            animation: pulse 2s ease-in-out infinite;
        }

        .hero-subtitle {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--grass-bright);
        }

        .hero-date {
            font-size: 1.3rem;
            opacity: 0.9;
            margin-bottom: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .hero-buttons {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 1.2rem 2.5rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.05rem;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.7rem;
            border: none;
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--grass-bright), var(--grass-light));
            color: var(--black);
            box-shadow: 0 6px 20px rgba(74, 222, 74, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 10px 30px rgba(74, 222, 74, 0.6);
        }

        .btn-whatsapp {
            background: #25D366;
            color: var(--white);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4);
        }

        .btn-whatsapp:hover {
            background: #128C7E;
            transform: translateY(-3px);
        }

        .scroll-indicator {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            animation: bounce 2s infinite;
            font-size: 2rem;
            color: var(--grass-bright);
            opacity: 0.7;
        }

        /* Countdown Section */
        .countdown-section {
            padding: 4rem 2rem;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 2;
            width: 100%;
        }

        .section-title {
            text-align: center;
            font-family: 'Russo One', sans-serif;
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            margin-bottom: 3rem;
            color: var(--white);
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .countdown-container {
            display: flex;
            justify-content: center;
            gap: 2rem;
            flex-wrap: wrap;
            width: 100%;
            max-width: 1100px; /* Լայն, բայց կարգավորված */
            margin: 0 auto;
        }

        .countdown-item {
            background: linear-gradient(135deg, rgba(26, 95, 26, 0.8), rgba(15, 40, 20, 0.9));
            padding: 2rem 1.5rem;
            border-radius: 16px;
            flex: 1;
            min-width: 120px;
            max-width: 220px;
            text-align: center;
            border: 2px solid rgba(74, 222, 74, 0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
        }

        .countdown-item::before {
            content: "⚽";
            position: absolute;
            top: 5px;
            right: 10px;
            font-size: 1.5rem;
            opacity: 0.2;
        }

        .countdown-number {
            font-family: 'Russo One', sans-serif;
            font-size: clamp(2rem, 6vw, 3rem);
            font-weight: 900;
            color: var(--gold);
            display: block;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .countdown-label {
            font-size: 0.95rem;
            color: var(--grass-bright);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 0.5rem;
            font-weight: 600;
        }

        /* Details Section */
        .details-section {
            padding: 5rem 2rem;
            position: relative;
            z-index: 2;
            background: linear-gradient(180deg, rgba(15, 40, 20, 0.95), rgba(26, 95, 26, 0.95));
            width: 100%;
        }

        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            width: 100%;
            max-width: 1200px; /* Օպտիմալ լայնություն մեծ էկրանների համար */
            margin: 0 auto;
        }

        .detail-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
            padding: 2.5rem 2rem;
            border-radius: 20px;
            text-align: center;
            border: 2px solid rgba(74, 222, 74, 0.2);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            width: 100%;
        }

        .detail-card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(74, 222, 74, 0.1) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .detail-card:hover {
            transform: translateY(-8px);
            border-color: var(--grass-bright);
            box-shadow: 0 15px 40px rgba(74, 222, 74, 0.3);
        }

        .detail-card:hover::after {
            opacity: 1;
        }

        .detail-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--grass-bright), var(--grass-light));
            color: var(--black);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            margin: 0 auto 1.5rem;
            box-shadow: 0 8px 20px rgba(74, 222, 74, 0.4);
            position: relative;
            z-index: 1;
        }

        .detail-card h3 {
            font-family: 'Russo One', sans-serif;
            font-size: 1.4rem;
            margin-bottom: 1rem;
            color: var(--white);
            position: relative;
            z-index: 1;
        }

            color: rgba(255,255,255,0.85);
            font-size: 1.05rem;
            line-height:
